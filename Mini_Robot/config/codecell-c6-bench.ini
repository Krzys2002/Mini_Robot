# Bench bring-up profile for the CodeCell C6 robot provisioned in #309
# (track_width_um 40000, max_wheel_speed_mm_s 100, max_angular_mrad_s 5000).
# Use with: micro_robot_desktop --ble --config Mini_Robot/config/codecell-c6-bench.ini
#
# With a 40 mm track, the built-in 1.0 rad/s turn limit gives each wheel only
# 20 mm/s (about 12% output), which did not start the motors. 5.0 rad/s is the
# provisioned limit and gives the same 60% output as 0.1 m/s forward.
# These are bring-up ceilings, not calibrated or physically accepted limits (#167).
[manual]
maximum_linear_m_per_s = 0.1
maximum_angular_rad_per_s = 5.0

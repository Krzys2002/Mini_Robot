# Micro Robot desktop configuration (example).
#
# Copy this file to the per-user configuration location, or pass it with
# --config <file>, and edit the values you want to change:
#   macOS:   ~/Library/Preferences/Micro Robot/micro_robot.ini
#   Ubuntu:  ~/.config/Micro Robot/micro_robot.ini
#   Windows: %LOCALAPPDATA%/Micro Robot/micro_robot.ini
#
# Every setting is optional; the values below are the built-in defaults.
# Comments must be on their own line, starting with '#' or ';'.
# Invalid values are reported in the log and replaced by their defaults.

[logging]
# Minimum record level: debug, info, warning, or error.
level = info
# Append records to a log file in addition to stderr: true or false.
file_enabled = true
# Log file path; leave empty for the per-user default location.
file_path =

[robot]
# Identifier of the robot driven by the single-robot demo (0 to 4294967295).
id = 1

[simulation]
# Period of the timer advancing the simulated camera and transport (1 to 10000 ms).
update_interval_ms = 100
# Frame period of the fake camera source (1 to 10000 ms).
camera_frame_interval_ms = 33

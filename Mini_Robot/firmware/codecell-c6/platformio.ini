; CodeCell C6 production firmware build skeleton (#155).
; Every dependency is an immutable release or commit; see README.md for the
; provenance table and the dependency update/security review policy.
; `.github/scripts/check_firmware_pins.py` rejects moving references and
; `scripts/toolchain_provenance.py` rejects a PlatformIO Core other than the
; `requirements.txt` pin, then records firmware-provenance.json per build.

[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
; pioarduino 55.03.37 fixes Arduino-ESP32 3.3.7 and RISC-V GCC 14.2.0+20251107.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
extra_scripts = post:scripts/toolchain_provenance.py

; Build identity note (#154):
; This PlatformIO board target selects an ESP32-C6 Arduino toolchain profile.
; The deployed robot hardware is CodeCell C6 Drive and must be validated on the
; actual board/library APIs rather than inferred from the DevKitC board name.
; This project is a fresh build skeleton; no legacy HTTP controller is included.

; CodeCell 2.0.4 by commit. CodeCell declares an unversioned DriveCell
; dependency, so DriveCell is pinned explicitly here to the reviewed release.
lib_deps =
    https://github.com/microbotsio/CodeCell.git#795616b3fc6fa14c0e23fbdac8aed697d897d303
    microbotsio/DriveCell@1.1.3

; The framework adds -std=gnu++2a; replace every default with one C++20 flag.
build_unflags =
    -std=gnu++11
    -std=gnu++17
    -std=gnu++2a
    -std=gnu++2b
build_flags =
    -std=gnu++20
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_ESP32C6_DEV

; Measurement-only timing pilot for #156 (bench evidence, never a robot image).
; It compiles only pilot/, links NimBLE but neither CodeCell nor DriveCell, and
; touches no motor, sensor or GPIO pin. Build and use it as described in
; docs/testing/timing-pilot-156.md; it is not part of default builds.
[env:timing-pilot]
extends = env:esp32-c6-devkitc-1
build_src_filter = -<*> +<../pilot/>
lib_deps =
    h2zero/NimBLE-Arduino@2.3.6

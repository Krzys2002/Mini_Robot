; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv

; Build identity note (#154):
; This PlatformIO board target selects an ESP32-C6 Arduino toolchain profile.
; The deployed robot hardware is CodeCell C6 Drive and must be validated on the
; actual board/library APIs rather than inferred from the DevKitC board name.
; This project is a fresh build skeleton; no legacy HTTP controller is included.

lib_deps =
    https://github.com/microbotsio/CodeCell.git#795616b3fc6fa14c0e23fbdac8aed697d897d303
    microbotsio/DriveCell@1.1.3

; WebServer is part of the pinned Arduino core, not a registry dependency.
; Framework/toolchain releases are fixed by pioarduino 55.03.37.
build_unflags =
    -std=gnu++11
    -std=gnu++17
    -std=gnu++2b
build_flags =
    -std=gnu++20
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_ESP32C6_DEV

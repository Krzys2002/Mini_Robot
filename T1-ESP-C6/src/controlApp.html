<!DOCTYPE html>
<html>
<head>
    <title>Robot Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0002;
        }

        input, button, select {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            min-width: 120px;
            cursor: pointer;
        }

        .stop {
            background: red;
            color: white;
            font-weight: bold;
        }

        .clear {
            background: orange;
            color: black;
            font-weight: bold;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        pre {
            background: #222;
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }

        #joystickContainer {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #joystickBase {
            width: 240px;
            height: 240px;
            background: #ddd;
            border-radius: 50%;
            position: relative;
            touch-action: none;
            border: 4px solid #999;
        }

        #joystickStick {
            width: 80px;
            height: 80px;
            background: #444;
            border-radius: 50%;
            position: absolute;
            left: 80px;
            top: 80px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<h1>Robot Controller</h1>

<div class="card">
    <h2>Connection</h2>
    <label>Robot IP:</label>
    <input id="ip" value="192.168.4.1">
    <button onclick="updateStatus()">Connect / Refresh</button>
</div>

<div class="card">
    <h2>Joystick Control</h2>

    <div id="joystickContainer">
        <div id="joystickBase">
            <div id="joystickStick"></div>
        </div>
    </div>

    <div style="margin-top:15px;">
        <b>Move:</b> <span id="moveValue">0</span>
        &nbsp;&nbsp;
        <b>Rotation:</b> <span id="rotationValue">0</span>
    </div>

    <div style="margin-top:15px;">
        <button onclick="centerJoystick()">CENTER</button>
    </div>
</div>

<div class="card">
    <h2>Target Control</h2>

    <label>Distance [m]:</label>
    <input id="distance" type="number" step="0.1" value="1.0">

    <label>Angle [deg]:</label>
    <input id="angle" type="number" step="1" value="0">

    <label>
        <input id="imu" type="checkbox">
        Use IMU
    </label>

    <button onclick="sendTarget()">Send Target</button>
</div>

<div class="card">
    <h2>Emergency</h2>
    <button class="stop" onclick="emergencyStop()">EMERGENCY STOP</button>
    <button class="clear" onclick="clearEmergency()">Clear Emergency</button>
</div>

<div class="card">
    <h2>Status</h2>
    <pre id="status">No data</pre>
</div>

<script>
    let joystickActive = false;

    let moveCmd = 0;
    let rotationCmd = 0;

    const base = document.getElementById("joystickBase");
    const stick = document.getElementById("joystickStick");

    const BASE_SIZE = 240;
    const STICK_SIZE = 80;
    const MAX_RADIUS = (BASE_SIZE - STICK_SIZE) / 2;

    function baseUrl() {
        const ip = document.getElementById("ip").value.trim();
        return "http://" + ip;
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    async function apiGet(path) {
        const response = await fetch(baseUrl() + path);

        if (!response.ok) {
            const text = await response.text();
            throw new Error(text);
        }

        return await response.json();
    }

    // Serialize motion requests so a delayed /move cannot arrive after /target.
    // Generation changes cancel queued intent; firmware remains the safety gate.
    let motionRequests = Promise.resolve();
    let motionGeneration = 0;
    let safetyLatched = false;
    let estopRequest = Promise.resolve();
    function queueMotion(path, generation) {
        const request = motionRequests.catch(() => {}).then(() =>
            generation === motionGeneration && !safetyLatched ? apiGet(path) : null);
        motionRequests = request;
        return request;
    }

    async function sendMove(move, rotation) {
        move = clamp(Math.round(move), -100, 100);
        rotation = clamp(Math.round(rotation), -100, 100);

        try {
            await queueMotion(`/move?move=${move}&rotation=${rotation}`, motionGeneration);
        } catch (err) {
            showError(err);
        }
    }

    function updateJoystick(clientX, clientY) {
        const rect = base.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = clientX - centerX;
        let dy = clientY - centerY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > MAX_RADIUS) {
            dx = dx / distance * MAX_RADIUS;
            dy = dy / distance * MAX_RADIUS;
        }

        const stickX = dx + BASE_SIZE / 2 - STICK_SIZE / 2;
        const stickY = dy + BASE_SIZE / 2 - STICK_SIZE / 2;

        stick.style.left = stickX + "px";
        stick.style.top = stickY + "px";

        rotationCmd = clamp((dx / MAX_RADIUS) * 100, -100, 100);

        moveCmd = clamp((-dy / MAX_RADIUS) * 100, -100, 100);

        document.getElementById("moveValue").textContent =
            Math.round(moveCmd);

        document.getElementById("rotationValue").textContent =
            Math.round(rotationCmd);
    }

    function centerJoystick(sendStop = true) {
        stick.style.left = "80px";
        stick.style.top = "80px";

        moveCmd = 0;
        rotationCmd = 0;

        document.getElementById("moveValue").textContent = "0";
        document.getElementById("rotationValue").textContent = "0";

        if (sendStop) sendMove(0, 0);
    }

    base.addEventListener("pointerdown", (e) => {
        if (safetyLatched) return;
        ++motionGeneration;
        joystickActive = true;
        updateJoystick(e.clientX, e.clientY);
    });

    window.addEventListener("pointermove", (e) => {
        if (!joystickActive) return;
        updateJoystick(e.clientX, e.clientY);
    });

    window.addEventListener("pointerup", () => {
        if (!joystickActive) return;
        joystickActive = false;
        centerJoystick();
    });

    setInterval(() => {
        if (joystickActive && !safetyLatched) sendMove(moveCmd, rotationCmd);
    }, 100);

    async function sendTarget() {
        if (safetyLatched) return;
        joystickActive = false;
        ++motionGeneration;
        const distance = Number(document.getElementById("distance").value);
        const angle = Number(document.getElementById("angle").value);
        const imu = document.getElementById("imu").checked ? 1 : 0;

        try {
            const data = await queueMotion(`/target?distance=${distance}&angle=${angle}&imu=${imu}`, motionGeneration);
            showResponse(data);
            updateStatus();
        } catch (err) {
            showError(err);
        }
    }

    async function emergencyStop() {
        safetyLatched = true;
        joystickActive = false;
        ++motionGeneration;
        try {
            estopRequest = apiGet("/estop");
            const data = await estopRequest;
            showResponse(data);
            updateStatus();
        } catch (err) {
            showError(err);
        }
    }

    async function clearEmergency() {
        joystickActive = false;
        ++motionGeneration;
        try {
            await estopRequest;
            await motionRequests.catch(() => {});
            const data = await apiGet("/clear_estop");
            if (data.ok) {
                safetyLatched = false;
                moveCmd = rotationCmd = 0;
            }
            showResponse(data);
            updateStatus();
        } catch (err) {
            showError(err);
        }
    }

    async function updateStatus() {
        try {
            const data = await apiGet("/status");
            showResponse(data);
        } catch (err) {
            showError(err);
        }
    }

    function showResponse(data) {
        document.getElementById("status").textContent =
            JSON.stringify(data, null, 2);
    }

    function showError(err) {
        document.getElementById("status").textContent =
            "ERROR:\n" + err.message;
    }

    centerJoystick(false);

    setInterval(updateStatus, 1000);
</script>
</body>
</html>

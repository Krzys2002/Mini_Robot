name: Linux build and test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Keep platform/compiler labels stable for daily run comparisons.
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same package list as docs/development/linux-setup.md.
          - name: Ubuntu 24.04 / GCC / Debug
            preset: linux-gcc
            packages: >-
              build-essential clang cmake ninja-build
              qt6-base-dev qt6-multimedia-dev qt6-connectivity-dev libgtest-dev libopencv-dev
            configure-options: -DMICRO_ROBOT_BUILD_DESKTOP=ON -DMICRO_ROBOT_BUILD_REPLAY=ON -DMICRO_ROBOT_BUILD_BLE=ON
          - name: Ubuntu 24.04 / Clang / Debug
            preset: linux-clang
            packages: >-
              build-essential clang cmake ninja-build
              qt6-base-dev qt6-multimedia-dev qt6-connectivity-dev libgtest-dev libopencv-dev
            configure-options: -DMICRO_ROBOT_BUILD_DESKTOP=ON -DMICRO_ROBOT_BUILD_REPLAY=ON -DMICRO_ROBOT_BUILD_BLE=ON
          # Qt and OpenCV are deliberately not installed: the core library and its
          # tests must build and pass without them.
          - name: Ubuntu 24.04 / GCC / Core without Qt and OpenCV
            preset: core
            packages: build-essential cmake ninja-build libgtest-dev
            configure-options: ""
    defaults:
      run:
        shell: bash
        working-directory: Mini_Robot
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}

      - name: Report tool versions
        run: |
          cmake --version
          ninja --version
          g++ --version
          if command -v clang++ > /dev/null; then clang++ --version; fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure-options }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      # The test preset runs every hardware-free regression test and excludes the
      # "hardware" label; it fails when no tests are found.
      - name: Run regression tests
        run: ctest --preset ${{ matrix.preset }}

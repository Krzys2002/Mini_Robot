name: macOS build and test

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    if: github.ref == 'refs/heads/master'
    name: macOS Apple Silicon / Debug
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Mini_Robot
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: brew install cmake ninja qt opencv

      # The macos presets match the Linux jobs: Debug, tests on, hardware tests excluded.
      - name: Configure desktop and tests
        run: >-
          cmake --preset macos
          -DMICRO_ROBOT_BUILD_DESKTOP=ON
          -DMICRO_ROBOT_BUILD_REPLAY=ON
          -DMICRO_ROBOT_BUILD_DOCUMENTATION=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build application and tests
        run: cmake --build --preset macos --parallel 3

      - name: Run regression tests
        run: ctest --preset macos

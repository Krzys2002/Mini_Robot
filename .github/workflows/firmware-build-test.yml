name: Firmware build and host tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned firmware build tools
        run: python -m pip install platformio==6.1.19
      - name: Build C6 without upload
        run: pio run -d Mini_Robot/firmware/codecell-c6 -e esp32-c6-devkitc-1
      - name: Record resolved firmware packages
        run: pio pkg list -d Mini_Robot/firmware/codecell-c6 -e esp32-c6-devkitc-1
      - name: Configure host tests without Arduino or desktop dependencies
        run: cmake -S Mini_Robot/firmware/codecell-c6 -B build/firmware-host -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/firmware-host --parallel 3
      - name: Run host tests
        run: ctest --test-dir build/firmware-host --output-on-failure --no-tests=error
